name: strapi

services:
  postgres:
    container_name: strapi-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    ports:
      - "5432:5432"
    volumes:
      - strapi-data:/var/lib/postgresql/data

volumes:
  strapi-data: